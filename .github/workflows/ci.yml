# CI for the public moreflow-io/chatbots mirror. This file is synced from the
# Moreflow monorepo (packages/chatbots/.github/workflows/ci.yml) by
# scripts/sync-chatbots-package.sh; GitHub ignores it inside the monorepo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: npm pack --dry-run
      - run: bunx publint
      - run: bunx --yes @arethetypeswrong/cli --pack --profile esm-only
